name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test Dhazel.Revertibles.slnx -c Release --verbosity normal

      - name: Pack
        run: dotnet pack Dhazel.Revertibles.slnx -c Release -o artifacts --no-build
